<!-- polls/templates/polls/error_page.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Error Page</title>
</head>
<body>
    <h1>An error occurred</h1>
    <p>The following events are supressed:</p>
    {% for key, value in error_details.items %}
        <li>{{ key }}: {{ value }}</li>
    {% endfor %}
    {% for key, value in error_args.items %}
        <li>{{ key }}: {{ value }}</li>
    {% endfor %}
    {% for arg in error_args %}
        <li>{{ arg }}</li>
    {% endfor %}
</body>
</html>
