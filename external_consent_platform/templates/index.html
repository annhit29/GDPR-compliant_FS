<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>GDPR Consent Platform</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    table { border-collapse: collapse; width: 100%; margin-top: 1em; }
    td, th { border: 1px solid #ddd; padding: .4em; }
  </style>
</head>
<body>
  <h2>Data Subject Portal</h2>
  <form method="post" action="{{ url_for('submit') }}">
    <input name="uid" placeholder="User full name" required>
    <select name="purpose">
      <option>service</option><option>analytics</option><option>marketing</option>
    </select>
    <button name="action" value="Consent">Consent</button>
    <button name="action" value="Revoke">Revoke</button>
  </form>

  <h3>Recent Events</h3>
  <table>
    <tr><th>Kind</th><th>User full name</th><th>Purpose</th><th>Status</th></tr>
    {% for e in events %}
    <tr><td>{{ e.kind }}</td><td>{{ e.uid }}</td><td>{{ e.purpose }}</td><td>{{ e.status }}</td></tr>
    {% endfor %}
  </table>

  <h3>Current States</h3>
  <table>
    <tr><th>User full name</th><th>Purpose</th><th>Status</th></tr>
    {% for s in states %}
    <tr><td>{{ s.uid }}</td><td>{{ s.purpose }}</td><td>{{ s.status }}</td></tr>
    {% endfor %}
  </table>
</body>
</html>
