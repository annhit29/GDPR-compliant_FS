<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Internal Purpose Platform</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    form { margin-top: 1em; }
    select, button { margin: 5px; padding: 5px; }
  </style>
  <script>
    const PURPOSES = {{ purposes | tojson }};
    function updateReasons() {
      const purpose = document.getElementById("purpose").value;
      const reasonSelect = document.getElementById("reason");
      reasonSelect.innerHTML = "";
      if (purpose && PURPOSES[purpose]) {
        PURPOSES[purpose].forEach(r => {
          const opt = document.createElement("option");
          opt.value = r;
          opt.textContent = r;
          reasonSelect.appendChild(opt);
        });
      }
    }
  </script>
</head>
<body onload="updateReasons()">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Internal Processing Portal</h2>
    <form method="post" action="{{ url_for('logout') }}">
      <button type="submit" style="background:#d9534f; color:white; padding:5px 10px; cursor:pointer;">
        Logout
      </button>
    </form>
  </div>

  <p>Logged in as <strong>{{ user.first_name }} {{ user.last_name }}</strong> ({{ user.uid }})</p>
  {% if current %}
    <p><strong>Active session:</strong> {{ current.purpose }} → {{ current.reason }} (since {{ current.started_at.strftime("%H:%M:%S") }})</p>
  {% else %}
    <p><em>No active session</em></p>
  {% endif %}
  <form method="post" action="{{ url_for('start_session') }}">
    <label>Purpose:</label>
    <select id="purpose" name="purpose" onchange="updateReasons()">
      {% for p in purposes.keys() %}
        <option value="{{ p }}">{{ p }}</option>
      {% endfor %}
    </select>

    <label>Reason:</label>
    <select id="reason" name="reason"></select>

    <button type="submit">Start Session</button>
  </form>

  <form method="post" action="{{ url_for('stop_session') }}">
    <button type="submit" style="background:#d9534f; color:white; padding:5px 10px; cursor:pointer;">
      Stop Session
    </button>
  </form>
</body>
</html>
